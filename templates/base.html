<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body>

    <header class="navbar">

        <div class="container nav-content">

            <a
                href="/"
                class="logo"
            >
                Fit<span>Buddy</span>
            </a>

            <nav>

                <a href="/">
                    Home
                </a>

            </nav>

        </div>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <div class="container">

            <p>
                FitBuddy AI Fitness Planner
            </p>

            <p class="muted">
                General fitness guidance only. Consult a qualified
                professional for personalized medical advice.
            </p>

        </div>

    </footer>

</body>

</html>
